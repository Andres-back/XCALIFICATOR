events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    ssl_certificate /etc/letsencrypt/live/alexsters.works/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexsters.works/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            default_type text/plain;
            return 404 "No hay aplicacion publicada en este host.\n";
        }
    }

    server {
        listen 80;
        server_name alexsters.works www.alexsters.works xcalificator.alexsters.works presenton.alexsters.works portainer.alexsters.works netdata.alexsters.works pgadmin.alexsters.works phpmyadmin.alexsters.works deploy.alexsters.works daimuz.alexsters.works herbariouniputumayo.alexsters.works codequest.alexsters.works mocoastore.alexsters.works xn--bajoelcap-e7a.alexsters.works;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name alexsters.works www.alexsters.works;

        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            default_type text/plain;
            return 404 "No hay aplicacion publicada en el dominio raiz. Usa un subdominio asignado.\n";
        }
    }

    server {
        listen 443 ssl;
        server_name xcalificator.alexsters.works;

        set $backend_upstream xcalificator_backend:8000;
        set $frontend_upstream xcalificator_frontend:80;

        client_max_body_size 15M;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 660s;
            proxy_read_timeout 660s;
        }

        location /uploads/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

