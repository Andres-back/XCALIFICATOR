events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1 _;

        client_max_body_size 25M;

        location /api/ {
            # Resolución dinámica: usa una variable para que nginx re-resuelva la IP
            # del backend vía el resolver (evita 502 cuando el contenedor se recrea).
            set $backend_upstream backend;
            proxy_pass http://$backend_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 30s;
            proxy_send_timeout 660s;
            proxy_read_timeout 660s;
        }

        location /uploads/ {
            set $backend_upstream backend;
            proxy_pass http://$backend_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location / {
            set $frontend_upstream frontend;
            proxy_pass http://$frontend_upstream:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
