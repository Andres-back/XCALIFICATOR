name: xcalificator_local

services:
  postgres:
    image: postgres:16-alpine
    container_name: xcalificator_local_postgres
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "5433:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xcalificator_local_redis
    restart: unless-stopped
    env_file:
      - .env.local
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xcalificator_local_backend
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - local_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xcalificator_local_frontend
    restart: unless-stopped
    env_file:
      - .env.local
    depends_on:
      - backend

  presenton:
    build:
      context: ./presenton_patches
      dockerfile: Dockerfile
    container_name: xcalificator_local_presenton
    restart: unless-stopped
    environment:
      LLM: ${PRESENTON_LLM:-custom}
      CUSTOM_LLM_URL: ${PRESENTON_CUSTOM_LLM_URL:-https://opencode.ai/zen/go/v1}
      CUSTOM_MODEL: ${PRESENTON_CUSTOM_MODEL:-qwen3.7-plus}
      CUSTOM_LLM_API_KEY: ${PRESENTON_CUSTOM_LLM_API_KEY}
      DISABLE_IMAGE_GENERATION: "${PRESENTON_DISABLE_IMAGES:-false}"
      IMAGE_PROVIDER: open_webui
      OPEN_WEBUI_IMAGE_URL: http://backend:8000/api/internal/presenton-images
      OPEN_WEBUI_IMAGE_API_KEY: ${PRESENTON_IMAGE_PROXY_TOKEN}
      PRESENTON_ASSET_TIMEOUT: "${PRESENTON_ASSET_TIMEOUT:-120}"
      PRESENTON_STRUCTURE_TIMEOUT: "${PRESENTON_STRUCTURE_TIMEOUT:-6}"
      PRESENTON_STRUCTURE_ATTEMPTS: "${PRESENTON_STRUCTURE_ATTEMPTS:-1}"
      PRESENTON_SLIDE_CONTENT_TIMEOUT: "${PRESENTON_SLIDE_CONTENT_TIMEOUT:-75}"
      PRESENTON_SLIDE_CONTENT_ATTEMPTS: "${PRESENTON_SLIDE_CONTENT_ATTEMPTS:-2}"
      APP_DATA_DIRECTORY: "/app_data"
      CAN_CHANGE_KEYS: "false"
      AUTH_USERNAME: xcalificator
      AUTH_PASSWORD: xcalificator-dev-only
      AUTH_OVERRIDE_FROM_ENV: "true"
    ports:
      - "5001:80"
    volumes:
      - local_presenton_data:/app_data
      - local_presenton_chrome:/root/.cache/puppeteer
      - ./presenton_patches/fastapi/llmai_patch.py:/app/servers/fastapi/llmai_patch.py:ro
      - ./presenton_patches/fastapi/api/main.py:/app/servers/fastapi/api/main.py:ro
      - ./presenton_patches/fastapi/api/middlewares.py:/app/servers/fastapi/api/middlewares.py:ro
      - ./presenton_patches/fastapi/utils/get_layout_by_name.py:/app/servers/fastapi/utils/get_layout_by_name.py:ro
      - ./presenton_patches/fastapi/utils/llm_calls/generate_presentation_outlines.py:/app/servers/fastapi/utils/llm_calls/generate_presentation_outlines.py:ro
      - ./presenton_patches/fastapi/utils/llm_calls/generate_presentation_structure.py:/app/servers/fastapi/utils/llm_calls/generate_presentation_structure.py:ro
      - ./presenton_patches/fastapi/utils/llm_calls/generate_slide_content.py:/app/servers/fastapi/utils/llm_calls/generate_slide_content.py:ro
      - ./presenton_patches/fastapi/utils/llm_calls/select_slide_type_on_edit.py:/app/servers/fastapi/utils/llm_calls/select_slide_type_on_edit.py:ro
      - ./presenton_patches/fastapi/api/v1/ppt/endpoints/presentation.py:/app/servers/fastapi/api/v1/ppt/endpoints/presentation.py:ro
      - ./presenton_patches/fastapi/static/images/placeholder.jpg:/app/servers/fastapi/static/images/placeholder.jpg:ro

  nginx:
    image: nginx:alpine
    container_name: xcalificator_local_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  pgadmin:
    image: dpage/pgadmin4
    container_name: xcalificator_local_pgadmin
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "5050:80"
    volumes:
      - local_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  local_pgdata:
  local_presenton_chrome:
  local_uploads:
  local_pgadmin_data:
  local_presenton_data:
