services:
  postgres:
    image: postgres:16-alpine
    container_name: xcalificator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xcalificator_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xcalificator_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xcalificator_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  paddleocr:
    build:
      context: ./paddleocr
      dockerfile: Dockerfile
    container_name: xcalificator_paddleocr
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - uploads:/app/uploads

  presenton:
    image: ghcr.io/presenton/presenton:latest
    container_name: xcalificator_presenton
    restart: unless-stopped
    ports:
      - "5001:80"
    environment:
      LLM: ${PRESENTON_LLM:-custom}
      CUSTOM_LLM_URL: ${PRESENTON_CUSTOM_LLM_URL:-https://api.groq.com/openai/v1}
      CUSTOM_MODEL: ${PRESENTON_CUSTOM_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      CUSTOM_LLM_API_KEY: ${GROQ_API_KEY}
      DISABLE_IMAGE_GENERATION: "false"
      APP_DATA_DIRECTORY: "/app_data"
      CAN_CHANGE_KEYS: "false"
      AUTH_USERNAME: ${PRESENTON_AUTH_USERNAME:-xcalificator}
      AUTH_PASSWORD: ${PRESENTON_AUTH_PASSWORD:-xcalificator-dev-only}
      AUTH_OVERRIDE_FROM_ENV: "true"
    volumes:
      - presenton_data:/app_data

  nginx:
    image: nginx:alpine
    container_name: xcalificator_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  pgadmin:
    image: dpage/pgadmin4
    container_name: xcalificator_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@xcalificator.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-xcalificator-dev-only}
    depends_on:
      - postgres
    profiles:
      - dev

volumes:
  pgdata:
  uploads:
  presenton_data:
